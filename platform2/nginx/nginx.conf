user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Large buffers for Angular JS bundles served by the registry
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    server {
        listen 80;
        server_name _;

        # Ask backend for uncompressed content so sub_filter can match strings
        proxy_set_header Accept-Encoding "";

        # Real client passthrough
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── NavNet brand assets (served directly — bypass proxy) ────────────
        location = /assets/logo_title_white.svg {
            alias /etc/nginx/assets/logo_title_white.svg;
            add_header Content-Type "image/svg+xml";
        }
        location = /assets/logo_white.svg {
            alias /etc/nginx/assets/logo_white.svg;
            add_header Content-Type "image/svg+xml";
        }
        # Favicon was renamed by sub_filter (ThingsBoard.ico → NavNet.ico);
        # proxy the request back under the original name so the browser gets it.
        location = /NavNet.ico {
            proxy_pass http://navnet-registry:9090/thingsboard.ico;
        }

        # ── WebSocket (live dashboard subscriptions) ─────────────────────────
        location /api/ws {
            proxy_pass http://navnet-registry:9090;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Everything else — NavNet brand substitution ──────────────────────
        location / {
            proxy_pass http://navnet-registry:9090;
            proxy_http_version 1.1;

            # Replace brand name in all text-based responses
            sub_filter_once off;
            sub_filter_types text/html text/javascript application/javascript text/css application/json;
            sub_filter 'ThingsBoard' 'NavNet';
        }
    }
}
