<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Outer hexagon -->
  <polygon points="100,6 185,51 185,148 100,193 15,148 15,51"
           fill="none" stroke="white" stroke-width="13" stroke-linejoin="round"/>
  <!-- Centre node -->
  <circle cx="100" cy="100" r="17" fill="white"/>
  <!-- Spokes -->
  <line x1="100" y1="6"   x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <line x1="185" y1="51"  x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <line x1="185" y1="148" x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <line x1="100" y1="193" x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <line x1="15"  y1="148" x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <line x1="15"  y1="51"  x2="100" y2="100" stroke="white" stroke-width="7" opacity="0.75"/>
  <!-- Vertex dots -->
  <circle cx="100" cy="6"   r="9" fill="white" opacity="0.85"/>
  <circle cx="185" cy="51"  r="9" fill="white" opacity="0.85"/>
  <circle cx="185" cy="148" r="9" fill="white" opacity="0.85"/>
  <circle cx="100" cy="193" r="9" fill="white" opacity="0.85"/>
  <circle cx="15"  cy="148" r="9" fill="white" opacity="0.85"/>
  <circle cx="15"  cy="51"  r="9" fill="white" opacity="0.85"/>
</svg>
