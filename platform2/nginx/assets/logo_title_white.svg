<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200">
  <!-- Hexagonal network icon -->
  <g transform="translate(10,4)">
    <!-- Outer hexagon -->
    <polygon points="96,4 180,48 180,136 96,180 12,136 12,48"
             fill="none" stroke="white" stroke-width="13" stroke-linejoin="round"/>
    <!-- Centre node -->
    <circle cx="96" cy="92" r="15" fill="white"/>
    <!-- Spokes from centre to each vertex -->
    <line x1="96" y1="4"   x2="96"  y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <line x1="180" y1="48" x2="96"  y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <line x1="180" y1="136" x2="96" y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <line x1="96"  y1="180" x2="96" y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <line x1="12"  y1="136" x2="96" y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <line x1="12"  y1="48"  x2="96" y2="92" stroke="white" stroke-width="7" opacity="0.75"/>
    <!-- Vertex dots -->
    <circle cx="96"  cy="4"   r="8" fill="white" opacity="0.85"/>
    <circle cx="180" cy="48"  r="8" fill="white" opacity="0.85"/>
    <circle cx="180" cy="136" r="8" fill="white" opacity="0.85"/>
    <circle cx="96"  cy="180" r="8" fill="white" opacity="0.85"/>
    <circle cx="12"  cy="136" r="8" fill="white" opacity="0.85"/>
    <circle cx="12"  cy="48"  r="8" fill="white" opacity="0.85"/>
  </g>
  <!-- NavNet wordmark -->
  <text x="210" y="158"
        font-family="Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="300"
        font-size="148"
        fill="white"
        letter-spacing="-1">NavNet</text>
</svg>
