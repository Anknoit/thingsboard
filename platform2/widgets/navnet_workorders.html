<!--
  NavNet WorkOrders — NavNet Widget
  Paste the entire contents of this file into the NavNet widget editor HTML tab.

  Widget settings schema (add in "Settings" tab of widget editor):
    FASTAPI_URL  (string, required)  e.g. http://localhost:8000
-->
<style>
  :host { display: block; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  #vwo-root {
    display: flex;
    flex-direction: column;
    height: 100%;
    font-family: Roboto, 'Helvetica Neue', sans-serif;
    font-size: 13px;
    color: var(--tb-primary-text, #212121);
    background: transparent;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  #vwo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--tb-divider, #e0e0e0);
    flex-shrink: 0;
  }
  #vwo-header h3 {
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #vwo-badge {
    background: #5c6bc0;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }
  #vwo-refresh-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--tb-secondary-text, #757575);
    font-size: 16px;
    padding: 3px 5px;
    border-radius: 4px;
    transition: background 0.15s;
    line-height: 1;
  }
  #vwo-refresh-btn:hover { background: rgba(0,0,0,0.06); }
  #vwo-refresh-btn.spinning { animation: vwo-spin 0.8s linear infinite; }
  @keyframes vwo-spin { to { transform: rotate(360deg); } }

  /* ── List ────────────────────────────────────────────────────────────── */
  #vwo-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 10px 10px;
  }

  /* ── Empty state ─────────────────────────────────────────────────────── */
  #vwo-empty {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--tb-secondary-text, #9e9e9e);
    font-size: 13px;
    gap: 6px;
    padding: 20px;
    text-align: center;
  }
  #vwo-empty .vwo-empty-icon { font-size: 28px; }

  /* ── Error ───────────────────────────────────────────────────────────── */
  #vwo-error {
    display: none;
    margin: 8px 10px;
    padding: 6px 10px;
    background: #ffebee;
    color: #c62828;
    border-radius: 4px;
    font-size: 12px;
  }

  /* ── Work order card ─────────────────────────────────────────────────── */
  .vwo-card {
    border: 1px solid var(--tb-divider, #e0e0e0);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--tb-background, #fff);
    transition: box-shadow 0.15s;
  }
  .vwo-card:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

  .vwo-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: #fafafa;
    border-bottom: 1px solid var(--tb-divider, #f0f0f0);
  }

  /* Priority badges */
  .vwo-pri {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    color: #fff;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .vwo-p1 { background: #d32f2f; }
  .vwo-p2 { background: #f57c00; }
  .vwo-p3 { background: #f9a825; color: #333; }
  .vwo-p4 { background: #1976d2; }
  .vwo-p5 { background: #757575; }

  .vwo-fault {
    flex: 1;
    font-size: 12px;
    font-weight: 500;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
  }

  /* Status pill */
  .vwo-status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
    font-weight: 500;
  }
  .vwo-status-open        { background: #e8f5e9; color: #2e7d32; }
  .vwo-status-acknowledged { background: #fff8e1; color: #f57f17; }
  .vwo-status-in_progress { background: #e3f2fd; color: #1565c0; }
  .vwo-status-closed      { background: #f5f5f5; color: #757575; }

  .vwo-card-body {
    padding: 7px 10px 8px;
  }
  .vwo-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 11px;
    color: var(--tb-secondary-text, #757575);
    margin-bottom: 6px;
  }
  .vwo-overdue { color: #c62828 !important; font-weight: 500; }

  /* Status update dropdown row */
  .vwo-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .vwo-status-label {
    font-size: 11px;
    color: var(--tb-secondary-text, #9e9e9e);
    white-space: nowrap;
  }
  .vwo-status-select {
    font-size: 12px;
    padding: 3px 6px;
    border: 1px solid var(--tb-divider, #bdbdbd);
    border-radius: 4px;
    background: var(--tb-background, #fff);
    color: inherit;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
    flex: 1;
    max-width: 160px;
  }
  .vwo-status-select:focus { border-color: #5c6bc0; }
  .vwo-status-select:disabled { opacity: 0.5; cursor: default; }

  .vwo-update-btn {
    font-size: 12px;
    padding: 3px 10px;
    border: none;
    border-radius: 4px;
    background: #5c6bc0;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .vwo-update-btn:hover:not(:disabled) { background: #3949ab; }
  .vwo-update-btn:disabled { opacity: 0.5; cursor: default; }
  .vwo-update-btn.success { background: #388e3c; }

  /* ── Footer ──────────────────────────────────────────────────────────── */
  #vwo-footer {
    flex-shrink: 0;
    padding: 5px 12px 7px;
    border-top: 1px solid var(--tb-divider, #e0e0e0);
    font-size: 11px;
    color: var(--tb-secondary-text, #9e9e9e);
    text-align: right;
  }
</style>

<div id="vwo-root">
  <div id="vwo-header">
    <h3>
      NavNet WorkOrders
      <span id="vwo-badge">0</span>
    </h3>
    <button id="vwo-refresh-btn" title="Refresh">↻</button>
  </div>

  <div id="vwo-error"></div>

  <div id="vwo-list">
    <div id="vwo-empty">
      <div class="vwo-empty-icon">✓</div>
      <div>No open work orders for this device</div>
    </div>
  </div>

  <div id="vwo-footer" id="vwo-last-refresh">–</div>
</div>

<script>
(function () {
  'use strict';

  const STATUS_LABELS = {
    open:         'Open',
    acknowledged: 'Acknowledged',
    in_progress:  'In Progress',
    closed:       'Closed',
  };

  // Valid forward transitions
  const TRANSITIONS = {
    open:         ['acknowledged', 'in_progress'],
    acknowledged: ['in_progress'],
    in_progress:  ['closed'],
    closed:       [],
  };

  let FASTAPI_URL = 'http://localhost:8000';
  let entityId    = '';
  let refreshTimer = null;

  // ── Helpers ───────────────────────────────────────────────────────────────

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function relativeTime(isoStr) {
    if (!isoStr) return '';
    const diff = Date.now() - new Date(isoStr).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  function formatDueBy(isoStr) {
    if (!isoStr) return null;
    const d = new Date(isoStr);
    const overdue = d < new Date();
    const label = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return { label, overdue };
  }

  function priClass(p) {
    return 'vwo-p' + Math.min(5, Math.max(1, parseInt(p) || 3));
  }

  function statusClass(s) {
    return 'vwo-status-' + (s || 'open').replace(' ', '_');
  }

  // ── Render ────────────────────────────────────────────────────────────────

  function renderCard(wo) {
    const div = document.createElement('div');
    div.className = 'vwo-card';
    div.dataset.id = wo.id;

    const transitions = TRANSITIONS[wo.status] || [];
    const dueBy = formatDueBy(wo.due_by);

    // Build status options
    const opts = transitions.map(t =>
      `<option value="${esc(t)}">${esc(STATUS_LABELS[t] || t)}</option>`
    ).join('');

    const actionsHtml = transitions.length > 0
      ? `<div class="vwo-actions">
           <span class="vwo-status-label">Move to:</span>
           <select class="vwo-status-select" data-id="${esc(wo.id)}">
             <option value="">— select —</option>
             ${opts}
           </select>
           <button class="vwo-update-btn" data-id="${esc(wo.id)}">Update</button>
         </div>`
      : `<div class="vwo-actions"><span class="vwo-status-label" style="color:#9e9e9e">No further transitions</span></div>`;

    div.innerHTML =
      `<div class="vwo-card-header">
         <span class="vwo-pri ${priClass(wo.priority)}">P${wo.priority || 3}</span>
         <span class="vwo-fault">${esc(wo.fault_description)}</span>
         <span class="vwo-status ${statusClass(wo.status)}">${esc(STATUS_LABELS[wo.status] || wo.status)}</span>
       </div>
       <div class="vwo-card-body">
         <div class="vwo-meta">
           <span>Created ${esc(relativeTime(wo.created_at))}</span>
           ${dueBy
             ? `<span class="${dueBy.overdue ? 'vwo-overdue' : ''}">Due: ${esc(dueBy.label)}${dueBy.overdue ? ' ⚠ Overdue' : ''}</span>`
             : ''}
           ${wo.estimated_labour_hours
             ? `<span>⏱ ${esc(String(wo.estimated_labour_hours))}h</span>` : ''}
         </div>
         ${actionsHtml}
       </div>`;

    return div;
  }

  // ── Load work orders ──────────────────────────────────────────────────────

  async function load() {
    const $list    = document.getElementById('vwo-list');
    const $empty   = document.getElementById('vwo-empty');
    const $error   = document.getElementById('vwo-error');
    const $badge   = document.getElementById('vwo-badge');
    const $refresh = document.getElementById('vwo-refresh-btn');
    const $footer  = document.getElementById('vwo-footer');

    $refresh.classList.add('spinning');
    $error.style.display = 'none';

    const statuses = 'open,acknowledged,in_progress';
    const url = `${FASTAPI_URL}/workorders?entity_id=${encodeURIComponent(entityId)}&status=${statuses}`;

    try {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      const items = data.items || [];

      // Clear existing cards (keep #vwo-empty)
      Array.from($list.children).forEach(child => {
        if (child.id !== 'vwo-empty') child.remove();
      });

      if (items.length === 0) {
        $empty.style.display = 'flex';
        $badge.textContent = '0';
      } else {
        $empty.style.display = 'none';
        $badge.textContent = String(items.length);
        items.forEach(wo => $list.appendChild(renderCard(wo)));
      }

      $footer.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    } catch (err) {
      $error.style.display = 'block';
      $error.textContent = 'Failed to load work orders: ' + err.message;
    } finally {
      $refresh.classList.remove('spinning');
    }
  }

  // ── Status update ─────────────────────────────────────────────────────────

  async function updateStatus(woId, newStatus, btn, select) {
    if (!newStatus) return;
    btn.disabled = true;
    select.disabled = true;
    btn.textContent = '…';

    try {
      const resp = await fetch(
        `${FASTAPI_URL}/workorders/${encodeURIComponent(woId)}/status`,
        {
          method:  'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ status: newStatus }),
        }
      );
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.detail || 'HTTP ' + resp.status);
      }
      btn.textContent = '✓';
      btn.classList.add('success');
      // Reload after a brief moment so the user sees the success state
      setTimeout(load, 800);
    } catch (err) {
      btn.textContent = 'Retry';
      btn.disabled = false;
      select.disabled = false;
      const $error = document.getElementById('vwo-error');
      $error.style.display = 'block';
      $error.textContent = 'Update failed: ' + err.message;
    }
  }

  // ── Event delegation for status updates ───────────────────────────────────

  document.getElementById('vwo-list').addEventListener('click', e => {
    const btn = e.target.closest('.vwo-update-btn');
    if (!btn) return;
    const woId  = btn.dataset.id;
    const card  = btn.closest('.vwo-card');
    const select = card && card.querySelector('.vwo-status-select');
    if (!select || !woId) return;
    updateStatus(woId, select.value, btn, select);
  });

  document.getElementById('vwo-refresh-btn').addEventListener('click', load);

  // ── NavNet lifecycle ─────────────────────────────────────────────────

  self.onInit = function () {
    const ctx = self.ctx;
    FASTAPI_URL = (ctx.widgetConfig && ctx.widgetConfig.FASTAPI_URL)
      ? ctx.widgetConfig.FASTAPI_URL.replace(/\/$/, '')
      : 'http://localhost:8000';

    const ds = ctx.datasources && ctx.datasources[0];
    entityId = ds ? (ds.entityId && ds.entityId.id ? ds.entityId.id : ds.entityId) : '';

    if (!entityId) {
      const $error = document.getElementById('vwo-error');
      $error.style.display = 'block';
      $error.textContent = 'No device selected. Add a device datasource to this widget.';
      return;
    }

    load();

    // Auto-refresh every 60 seconds
    refreshTimer = setInterval(load, 60000);
  };

  self.onDestroy = function () {
    if (refreshTimer) clearInterval(refreshTimer);
  };

  self.onResize   = function () {};
  self.onDataUpdated = function () {};

})();
</script>
