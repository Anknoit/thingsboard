<!--
  NavNet Chat — NavNet Widget
  Paste the entire contents of this file into the NavNet widget editor HTML tab.

  Widget settings schema (add in "Settings" tab of widget editor):
    FASTAPI_URL  (string, required)  e.g. http://localhost:8000
-->
<style>
  :host { display: block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #vc-root {
    display: flex;
    flex-direction: column;
    height: 100%;
    font-family: Roboto, 'Helvetica Neue', sans-serif;
    font-size: 13px;
    color: var(--tb-primary-text, #212121);
    background: transparent;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  #vc-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--tb-divider, #e0e0e0);
    flex-shrink: 0;
  }
  #vc-header .vc-icon {
    width: 20px; height: 20px;
    background: #5c6bc0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  #vc-device-name {
    font-weight: 500;
    font-size: 13px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #vc-clear-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--tb-secondary-text, #757575);
    font-size: 18px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  #vc-clear-btn:hover { background: rgba(0,0,0,0.06); }

  /* ── Context pills ───────────────────────────────────────────────────── */
  #vc-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 12px;
    border-bottom: 1px solid var(--tb-divider, #e0e0e0);
    flex-shrink: 0;
  }
  .vc-pill {
    background: var(--tb-primary-bg, #e8eaf6);
    color: var(--tb-primary-text, #3949ab);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ── Response area ───────────────────────────────────────────────────── */
  #vc-response-area {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    scroll-behavior: smooth;
  }
  #vc-response-text {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 13px;
    color: var(--tb-primary-text, #212121);
  }
  #vc-response-text strong { font-weight: 600; }

  /* ── Typing indicator ────────────────────────────────────────────────── */
  #vc-typing {
    display: none;
    align-items: center;
    gap: 4px;
    padding: 6px 0 2px;
  }
  #vc-typing.visible { display: flex; }
  .vc-dot {
    width: 7px; height: 7px;
    background: #9e9e9e;
    border-radius: 50%;
    animation: vc-bounce 1.3s infinite ease-in-out;
  }
  .vc-dot:nth-child(2) { animation-delay: 0.15s; }
  .vc-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes vc-bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-5px); }
  }

  /* ── Work order card ─────────────────────────────────────────────────── */
  #vc-wo-card {
    display: none;
    margin-top: 10px;
    border: 1px solid var(--tb-divider, #e0e0e0);
    border-radius: 6px;
    overflow: hidden;
  }
  .vc-wo-header {
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f5f5f5;
    border-bottom: 1px solid var(--tb-divider, #e0e0e0);
  }
  .vc-priority-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    color: #fff;
    flex-shrink: 0;
  }
  .vc-p1 { background: #d32f2f; }
  .vc-p2 { background: #f57c00; }
  .vc-p3 { background: #f9a825; color: #333; }
  .vc-p4 { background: #1976d2; }
  .vc-p5 { background: #757575; }
  .vc-wo-title { font-weight: 500; font-size: 12px; flex: 1; }
  .vc-wo-body { padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  .vc-wo-steps { margin: 4px 0 6px 14px; }
  .vc-wo-steps li { margin-bottom: 2px; }
  .vc-parts {
    display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
  }
  .vc-part-tag {
    background: #e3f2fd;
    color: #1565c0;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
  }
  .vc-wo-meta {
    display: flex; gap: 12px;
    margin-top: 6px;
    font-size: 11px;
    color: #757575;
  }

  /* ── Copy button ─────────────────────────────────────────────────────── */
  #vc-copy-btn {
    display: none;
    margin-top: 8px;
    background: none;
    border: 1px solid var(--tb-divider, #bdbdbd);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--tb-secondary-text, #616161);
    transition: background 0.15s;
  }
  #vc-copy-btn:hover { background: rgba(0,0,0,0.05); }

  /* ── Error banner ────────────────────────────────────────────────────── */
  #vc-error {
    display: none;
    margin: 6px 0;
    padding: 6px 10px;
    background: #ffebee;
    color: #c62828;
    border-radius: 4px;
    font-size: 12px;
  }

  /* ── Input area ──────────────────────────────────────────────────────── */
  #vc-input-area {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--tb-divider, #e0e0e0);
    flex-shrink: 0;
  }
  #vc-question {
    flex: 1;
    resize: none;
    border: 1px solid var(--tb-divider, #bdbdbd);
    border-radius: 6px;
    padding: 7px 9px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.4;
    min-height: 36px;
    max-height: 100px;
    outline: none;
    transition: border-color 0.15s;
    background: var(--tb-background, #fff);
    color: inherit;
  }
  #vc-question:focus { border-color: #5c6bc0; }
  #vc-send-btn {
    background: #5c6bc0;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #vc-send-btn:hover:not(:disabled) { background: #3949ab; }
  #vc-send-btn:disabled { opacity: 0.5; cursor: default; }
</style>

<div id="vc-root">
  <!-- Header -->
  <div id="vc-header">
    <div class="vc-icon">AI</div>
    <span id="vc-device-name">Loading...</span>
    <button id="vc-clear-btn" title="Clear conversation">×</button>
  </div>

  <!-- Context pills -->
  <div id="vc-pills"></div>

  <!-- Response area -->
  <div id="vc-response-area">
    <div id="vc-response-text"></div>
    <div id="vc-typing">
      <div class="vc-dot"></div>
      <div class="vc-dot"></div>
      <div class="vc-dot"></div>
    </div>
    <div id="vc-error"></div>
    <div id="vc-wo-card"></div>
    <button id="vc-copy-btn">Copy response</button>
  </div>

  <!-- Input -->
  <div id="vc-input-area">
    <textarea
      id="vc-question"
      rows="1"
      placeholder="Ask about this device…"
    ></textarea>
    <button id="vc-send-btn">Send</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── NavNet widget lifecycle ──────────────────────────────────────────

  self.onInit = function () {
    try {
    const ctx = self.ctx;

    // Widget settings
    const FASTAPI_URL = (ctx.widgetConfig && ctx.widgetConfig.FASTAPI_URL)
      ? ctx.widgetConfig.FASTAPI_URL.replace(/\/$/, '')
      : 'http://localhost:8000';

    // Device info from datasource
    const ds         = ctx.datasources && ctx.datasources[0];
    const entityId   = ds ? (ds.entityId && ds.entityId.id ? ds.entityId.id : ds.entityId) : '';
    const entityName = ds ? (ds.entityName || ds.name || 'Unknown device') : 'Unknown device';

    // Use widget container scope — more reliable than document.getElementById in NavNet
    const root = (ctx.$container && ctx.$container[0]) || document;
    const q    = id => root.querySelector('#' + id);

    // UI refs
    const $deviceName   = q('vc-device-name');
    const $pills        = q('vc-pills');
    const $responseText = q('vc-response-text');
    const $typing       = q('vc-typing');
    const $error        = q('vc-error');
    const $woCard       = q('vc-wo-card');
    const $copyBtn      = q('vc-copy-btn');
    const $question     = q('vc-question');
    const $sendBtn      = q('vc-send-btn');
    const $clearBtn     = q('vc-clear-btn');

    if (!$sendBtn || !$question) {
      console.error('NavNet Chat: widget DOM elements not found');
      return;
    }

    if ($deviceName) $deviceName.textContent = entityName;

    // ── Telemetry pills ───────────────────────────────────────────────────
    function refreshPills() {
      const data = ctx.data || [];
      if ($pills) $pills.innerHTML = '';
      let count = 0;
      for (const series of data) {
        if (!series.data || !series.data.length) continue;
        const key   = series.dataKey && series.dataKey.label || series.dataKey && series.dataKey.name || '?';
        const value = series.data[series.data.length - 1][1];
        if (value === undefined || value === null) continue;
        const pill = document.createElement('span');
        pill.className = 'vc-pill';
        pill.title = key + ': ' + value;
        pill.textContent = key + ': ' + (typeof value === 'number' ? value.toFixed(2) : value);
        $pills.appendChild(pill);
        if (++count >= 6) break; // Show max 6 pills
      }
    }
    refreshPills();

    // ── State ─────────────────────────────────────────────────────────────
    let streaming  = false;
    let fullText   = '';
    let lastAlarm  = '';

    // Try to detect last alarm from telemetry context
    const data = ctx.data || [];
    for (const series of data) {
      const key = series.dataKey && (series.dataKey.label || series.dataKey.name || '');
      if (key.toLowerCase().includes('alarm') && series.data && series.data.length) {
        lastAlarm = String(series.data[series.data.length - 1][1]);
        break;
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────
    function setStreaming(on) {
      streaming = on;
      $sendBtn.disabled = on;
      $typing.classList.toggle('visible', on);
    }

    function showError(msg) {
      $error.style.display = 'block';
      $error.textContent = msg;
    }

    function clearError() {
      $error.style.display = 'none';
      $error.textContent = '';
    }

    function scrollBottom() {
      const area = document.getElementById('vc-response-area');
      area.scrollTop = area.scrollHeight;
    }

    function renderMarkdownLight(text) {
      // Minimal markdown: **bold**, numbered lists, newlines
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function priorityClass(p) {
      return 'vc-p' + Math.min(5, Math.max(1, parseInt(p) || 3));
    }

    function renderWorkOrder(id, data) {
      const pClass = priorityClass(data.priority);
      const steps  = (data.steps || []).map((s, i) =>
        '<li>' + escHtml(s) + '</li>'
      ).join('');
      const parts  = (data.parts || []).map(p =>
        '<span class="vc-part-tag">' +
          escHtml(p.name || p) +
          (p.stock_code && p.stock_code !== 'null' ? ' [' + escHtml(p.stock_code) + ']' : '') +
        '</span>'
      ).join('');

      $woCard.style.display = 'block';
      $woCard.innerHTML =
        '<div class="vc-wo-header">' +
          '<span class="vc-priority-badge ' + pClass + '">P' + (data.priority || 3) + '</span>' +
          '<span class="vc-wo-title">Work Order created</span>' +
          '<span style="font-size:11px;color:#757575">ID: ' + escHtml(id.slice(0, 8)) + '…</span>' +
        '</div>' +
        '<div class="vc-wo-body">' +
          '<div style="font-weight:500;margin-bottom:4px">' + escHtml(data.fault_description || '') + '</div>' +
          (steps ? '<ol class="vc-wo-steps">' + steps + '</ol>' : '') +
          (parts ? '<div class="vc-parts">' + parts + '</div>' : '') +
          '<div class="vc-wo-meta">' +
            '<span>⏱ ' + (data.labour_hours || '?') + 'h labour</span>' +
          '</div>' +
        '</div>';
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ── Latest telemetry for request body ─────────────────────────────────
    function getLatestTelemetry() {
      const out = {};
      for (const series of (ctx.data || [])) {
        const key = series.dataKey && (series.dataKey.label || series.dataKey.name);
        if (key && series.data && series.data.length) {
          out[key] = series.data[series.data.length - 1][1];
        }
      }
      return out;
    }

    // ── Send ──────────────────────────────────────────────────────────────
    async function send() {
      const question = $question.value.trim();
      if (!question || streaming) return;

      clearError();
      $woCard.style.display = 'none';
      $copyBtn.style.display = 'none';
      $responseText.innerHTML = '';
      fullText = '';
      setStreaming(true);
      scrollBottom();

      const body = {
        entity_id: entityId,
        question:  question,
        widget_context: {
          entity_name:       entityName,
          latest_telemetry:  getLatestTelemetry(),
          last_alarm:        lastAlarm || null,
        },
      };

      try {
        const resp = await fetch(FASTAPI_URL + '/chat', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.detail || 'HTTP ' + resp.status);
        }

        const reader  = resp.body.getReader();
        const decoder = new TextDecoder();
        let   buf     = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop(); // keep incomplete line

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            let event;
            try { event = JSON.parse(line.slice(6)); } catch { continue; }

            if (event.type === 'token') {
              fullText += event.content;
              $responseText.innerHTML = renderMarkdownLight(fullText);
              scrollBottom();

            } else if (event.type === 'work_order') {
              renderWorkOrder(event.id, event.data);
              scrollBottom();

            } else if (event.type === 'done') {
              setStreaming(false);
              $copyBtn.style.display = 'inline-block';

            } else if (event.type === 'error') {
              setStreaming(false);
              showError(event.message || 'An error occurred.');
            }
          }
        }
      } catch (err) {
        setStreaming(false);
        showError('Connection error: ' + err.message);
      }
    }

    // ── Clear ─────────────────────────────────────────────────────────────
    function clear() {
      $responseText.innerHTML = '';
      $woCard.style.display = 'none';
      $copyBtn.style.display = 'none';
      $question.value = '';
      clearError();
      fullText = '';
      setStreaming(false);
    }

    // ── Copy ──────────────────────────────────────────────────────────────
    $copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(fullText).then(() => {
        $copyBtn.textContent = 'Copied!';
        setTimeout(() => { $copyBtn.textContent = 'Copy response'; }, 1500);
      });
    });

    // ── Event listeners ───────────────────────────────────────────────────
    $sendBtn.addEventListener('click', send);
    $clearBtn.addEventListener('click', clear);

    $question.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); send(); }
    });

    // Auto-resize textarea
    $question.addEventListener('input', () => {
      $question.style.height = 'auto';
      $question.style.height = Math.min($question.scrollHeight, 100) + 'px';
    });

    } catch (err) {
      console.error('NavNet Chat onInit error:', err);
      const errEl = document.querySelector('#vc-error') || (self.ctx && self.ctx.$container && self.ctx.$container[0] && self.ctx.$container[0].querySelector('#vc-error'));
      if (errEl) { errEl.style.display = 'block'; errEl.textContent = 'Widget init error: ' + err.message; }
    }
  };

  // Called by NavNet when telemetry data updates
  self.onDataUpdated = function () {
    if (self.ctx && self.ctx.data) {
      const root = (self.ctx.$container && self.ctx.$container[0]) || document;
      const $pills = root.querySelector('#vc-pills');
      if (!$pills) return;
      $pills.innerHTML = '';
      let count = 0;
      for (const series of (self.ctx.data || [])) {
        if (!series.data || !series.data.length) continue;
        const key   = series.dataKey && (series.dataKey.label || series.dataKey.name || '?');
        const value = series.data[series.data.length - 1][1];
        if (value === undefined || value === null) continue;
        const pill = document.createElement('span');
        pill.className = 'vc-pill';
        pill.title = key + ': ' + value;
        pill.textContent = key + ': ' + (typeof value === 'number' ? Number(value).toFixed(2) : value);
        $pills.appendChild(pill);
        if (++count >= 6) break;
      }
    }
  };

  self.onResize = function () {};
  self.onDestroy = function () {};

})();
</script>
